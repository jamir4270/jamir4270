<svg xmlns="http://www.w3.org/2000/svg" width="840" height="188" viewBox="0 0 840 188" role="img" aria-label="Project Florence: Faculty of Nursing records platform: council events and payments, merits, demerits, service hours and clearance." font-family="'Segoe UI', 'Frutiger', 'Helvetica Neue', 'Noto Sans', Arial, sans-serif"><title>Project Florence: Faculty of Nursing records platform: council events and payments, merits, demerits, service hours and clearance.</title><style>
.sweep{animation:sweep 18s ease-in-out infinite}
@keyframes sweep{0%,60%{transform:skewX(-18deg) translateX(0)}90%,100%{transform:skewX(-18deg) translateX(1300px)}}
.orb{animation:bob 7s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs>
<linearGradient id="skyflorence" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#16302F"/><stop offset="1" stop-color="#0F1E1F"/></linearGradient>
<linearGradient id="glossflorence" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="sweepflorence" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".35"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="orbflorence" cx=".35" cy=".3" r=".75">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".35" stop-color="#4FA3AC" stop-opacity=".55"/>
  <stop offset="1" stop-color="#5E8F72" stop-opacity=".35"/></radialGradient>
<radialGradient id="hazeflorence" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#8F86B3" stop-opacity=".55"/><stop offset="1" stop-color="#8F86B3" stop-opacity="0"/></radialGradient>
<filter id="shadowflorence" x="-5%" y="-10%" width="110%" height="130%">
  <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs>
<g filter="url(#shadowflorence)">
  <rect x="16" y="16" width="808" height="156" rx="16" fill="url(#skyflorence)"/>
  <rect x="16" y="16" width="808" height="156" rx="16" fill="#BFE3E6" fill-opacity="0.08"/>
</g>
<clipPath id="clipflorence"><rect x="16" y="16" width="808" height="156" rx="16"/></clipPath>
<g clip-path="url(#clipflorence)">
  <rect x="16" y="16" width="808" height="70" fill="url(#glossflorence)"/>
  <rect class="sweep" x="-220" y="0" width="160" height="188" fill="url(#sweepflorence)" transform="skewX(-18)"
        style="animation-delay:4s"/>
</g>
<rect x="16.5" y="16.5" width="807" height="155" rx="15.5" fill="none" stroke="#BFE3E6" stroke-opacity=".75"/>
<g class="orb" style="animation-delay:-4s">
  <circle cx="72" cy="94" r="34" fill="url(#orbflorence)" stroke="#FFFFFF" stroke-opacity=".8"/>
  <ellipse cx="62" cy="78" rx="16" ry="8" fill="#FFFFFF" fill-opacity=".6"/>
  <text x="72" y="103" text-anchor="middle" font-size="26" font-weight="300" fill="#E3F0EC">F</text>
</g>
<text x="128" y="52" font-size="22" font-weight="600" fill="#E3F0EC">Project Florence</text>
<text x="800" y="52" text-anchor="end" font-size="18" fill="#9DB5AE">↗</text>
<text x="128" y="80" font-size="14.5" fill="#9DB5AE">Faculty of Nursing records platform: council events and payments,</text><text x="128" y="101" font-size="14.5" fill="#9DB5AE">merits, demerits, service hours and clearance.</text>
<rect x="128" y="124" width="87" height="24" rx="12" fill="#BFE3E6" fill-opacity="0.12" stroke="#BFE3E6" stroke-opacity=".6"/><text x="172" y="140" text-anchor="middle" font-size="12" fill="#DCEDE8">Next.js 16</text><rect x="223" y="124" width="87" height="24" rx="12" fill="#BFE3E6" fill-opacity="0.12" stroke="#BFE3E6" stroke-opacity=".6"/><text x="267" y="140" text-anchor="middle" font-size="12" fill="#DCEDE8">PostgreSQL</text><rect x="318" y="124" width="107" height="24" rx="12" fill="#BFE3E6" fill-opacity="0.12" stroke="#BFE3E6" stroke-opacity=".6"/><text x="372" y="140" text-anchor="middle" font-size="12" fill="#DCEDE8">Supabase Auth</text><rect x="434" y="124" width="107" height="24" rx="12" fill="#BFE3E6" fill-opacity="0.12" stroke="#BFE3E6" stroke-opacity=".6"/><text x="487" y="140" text-anchor="middle" font-size="12" fill="#DCEDE8">Cloudflare R2</text></svg>