<svg xmlns="http://www.w3.org/2000/svg" width="840" height="70" viewBox="0 0 840 70" role="img" aria-label="decorative wave" font-family="'Segoe UI', 'Frutiger', 'Helvetica Neue', 'Noto Sans', Arial, sans-serif"><title>decorative wave</title><style>
.w1{animation:flow 28s linear infinite}.w2{animation:flow 40s linear infinite reverse}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-630px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs>
<linearGradient id="skyw" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#CFE6EC"/><stop offset="1" stop-color="#EEF5F2"/></linearGradient>
<linearGradient id="glossw" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="sweepw" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".35"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="orbw" cx=".35" cy=".3" r=".75">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".35" stop-color="#8CCFD6" stop-opacity=".55"/>
  <stop offset="1" stop-color="#8DB596" stop-opacity=".35"/></radialGradient>
<radialGradient id="hazew" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#C9C3DE" stop-opacity=".55"/><stop offset="1" stop-color="#C9C3DE" stop-opacity="0"/></radialGradient>
<filter id="shadoww" x="-5%" y="-10%" width="110%" height="130%">
  <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2F4A3E" flood-opacity="0.12"/></filter>
</defs>
<path class="w1" d="M0 40 C 105 20, 210 60, 315 40 S 525 20, 630 40 S 840 60, 945 40 S 1155 20, 1260 40 S 1470 60, 1575 40 S 1785 20, 1890 40 V 70 H 0 Z" fill="#8CCFD6" fill-opacity=".25"/>
<path class="w2" d="M0 40 C 105 20, 210 60, 315 40 S 525 20, 630 40 S 840 60, 945 40 S 1155 20, 1260 40 S 1470 60, 1575 40 S 1785 20, 1890 40 V 70 H 0 Z" fill="#8DB596" fill-opacity=".3" transform="translate(0 10)"/></svg>