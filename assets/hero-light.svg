<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-label="Jamir Oasis Andrade, full-stack web developer" font-family="'Segoe UI', 'Frutiger', 'Helvetica Neue', 'Noto Sans', Arial, sans-serif"><title>Jamir Oasis Andrade, full-stack web developer</title><style>
.b{animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}50%{transform:translate(8px,-100px)}
88%{opacity:.8}100%{transform:translate(-6px,-210px);opacity:0}}
.f1{animation:drift 30s ease-in-out infinite alternate}
.f2{animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE6EC"/><stop offset="1" stop-color="#EEF5F2"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="orb" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
  <stop offset=".35" stop-color="#8CCFD6" stop-opacity=".55"/><stop offset="1" stop-color="#8DB596" stop-opacity=".35"/></radialGradient>
<clipPath id="clip"><rect width="840" height="230" rx="16"/></clipPath></defs>
<g clip-path="url(#clip)">
  <rect width="840" height="230" fill="url(#sky)"/>
  <path class="f1" d="M-40 185 C 120 160, 260 195, 420 175 S 700 155, 880 180 V 240 H -40 Z" fill="#8DB596" fill-opacity=".35"/>
  <path class="f2" d="M-40 205 C 150 185, 330 215, 520 195 S 760 190, 880 205 V 240 H -40 Z" fill="#8DB596" fill-opacity=".5"/>
  <circle class="b" cx="90" cy="200" r="14" fill="url(#orb)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:26s;animation-delay:-3s"/><circle class="b" cx="180" cy="225" r="7" fill="url(#orb)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:20s;animation-delay:-11s"/><circle class="b" cx="560" cy="215" r="18" fill="url(#orb)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:32s;animation-delay:-8s"/><circle class="b" cx="640" cy="235" r="9" fill="url(#orb)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:22s;animation-delay:-15s"/><circle class="b" cx="720" cy="205" r="12" fill="url(#orb)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:28s;animation-delay:-1s"/><circle class="b" cx="780" cy="230" r="6" fill="url(#orb)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:18s;animation-delay:-6s"/><circle class="b" cx="470" cy="240" r="8" fill="url(#orb)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:24s;animation-delay:-19s"/><circle class="b" cx="300" cy="235" r="5" fill="url(#orb)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:19s;animation-delay:-9s"/>
  <rect width="840" height="110" fill="url(#gloss)"/>
</g>
<rect x=".5" y=".5" width="839" height="229" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity=".6"/>
