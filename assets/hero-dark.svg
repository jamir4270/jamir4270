<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-label="Jamir Oasis Andrade, full-stack web developer" font-family="'Segoe UI', 'Frutiger', 'Helvetica Neue', 'Noto Sans', Arial, sans-serif"><title>Jamir Oasis Andrade, full-stack web developer</title><style>
.b{animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}50%{transform:translate(8px,-110px)}
88%{opacity:.8}100%{transform:translate(-6px,-230px);opacity:0}}
.sweep{animation:sweep 16s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:skewX(-18deg) translateX(0)}85%,100%{transform:skewX(-18deg) translateX(1400px)}}
.haze{animation:breathe 14s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.6}to{opacity:1}}
.f1{animation:drift 30s ease-in-out infinite alternate}
.f2{animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs>
<linearGradient id="skyh" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#16302F"/><stop offset="1" stop-color="#0F1E1F"/></linearGradient>
<linearGradient id="glossh" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="sweeph" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".35"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="orbh" cx=".35" cy=".3" r=".75">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".35" stop-color="#4FA3AC" stop-opacity=".55"/>
  <stop offset="1" stop-color="#5E8F72" stop-opacity=".35"/></radialGradient>
<radialGradient id="hazeh" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#8F86B3" stop-opacity=".55"/><stop offset="1" stop-color="#8F86B3" stop-opacity="0"/></radialGradient>
<filter id="shadowh" x="-5%" y="-10%" width="110%" height="130%">
  <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs>
<clipPath id="cliph"><rect x="16" y="0" width="808" height="250" rx="20"/></clipPath>
<g clip-path="url(#cliph)">
  <rect width="840" height="250" fill="url(#skyh)"/>
  <ellipse class="haze" cx="680" cy="40" rx="260" ry="140" fill="url(#hazeh)"/>
  <path class="f1" d="M-40 205 C 120 180, 260 215, 420 195 S 700 175, 880 200 V 260 H -40 Z" fill="#5E8F72" fill-opacity=".35"/>
  <path class="f2" d="M-40 225 C 150 205, 330 235, 520 215 S 760 210, 880 225 V 260 H -40 Z" fill="#5E8F72" fill-opacity=".5"/>
  <circle class="b" cx="90" cy="210" r="14" fill="url(#orbh)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:26s;animation-delay:-3s"/><circle class="b" cx="180" cy="240" r="7" fill="url(#orbh)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:20s;animation-delay:-11s"/><circle class="b" cx="560" cy="230" r="18" fill="url(#orbh)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:32s;animation-delay:-8s"/><circle class="b" cx="640" cy="250" r="9" fill="url(#orbh)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:22s;animation-delay:-15s"/><circle class="b" cx="720" cy="220" r="12" fill="url(#orbh)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:28s;animation-delay:-1s"/><circle class="b" cx="780" cy="245" r="6" fill="url(#orbh)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:18s;animation-delay:-6s"/><circle class="b" cx="470" cy="255" r="8" fill="url(#orbh)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:24s;animation-delay:-19s"/><circle class="b" cx="300" cy="250" r="5" fill="url(#orbh)" stroke="#FFFFFF" stroke-opacity=".7" style="animation-duration:19s;animation-delay:-9s"/>
  <rect width="840" height="120" fill="url(#glossh)"/>
  <rect class="sweep" x="-260" y="0" width="200" height="250" fill="url(#sweeph)" transform="skewX(-18)"/>
</g>
<rect x="16.5" y=".5" width="807" height="249" rx="19.5" fill="none" stroke="#BFE3E6" stroke-opacity=".7"/>
<text x="48" y="96" font-size="44" font-weight="300" letter-spacing=".5" fill="#E3F0EC">Jamir Oasis Andrade</text>
<text x="50" y="128" font-size="17" fill="#9DB5AE">Full-stack web developer · digitizing traditional workflows</text>
<rect x="50" y="148" width="80" height="24" rx="12" fill="#BFE3E6" fill-opacity="0.12" stroke="#BFE3E6" stroke-opacity=".6"/><text x="90" y="164" text-anchor="middle" font-size="12" fill="#DCEDE8">Freelance</text><rect x="138" y="148" width="121" height="24" rx="12" fill="#BFE3E6" fill-opacity="0.12" stroke="#BFE3E6" stroke-opacity=".6"/><text x="199" y="164" text-anchor="middle" font-size="12" fill="#DCEDE8">Veris · Backend</text><rect x="267" y="148" width="128" height="24" rx="12" fill="#BFE3E6" fill-opacity="0.12" stroke="#BFE3E6" stroke-opacity=".6"/><text x="331" y="164" text-anchor="middle" font-size="12" fill="#DCEDE8">GCI World Cohort</text><rect x="403" y="148" width="101" height="24" rx="12" fill="#BFE3E6" fill-opacity="0.12" stroke="#BFE3E6" stroke-opacity=".6"/><text x="453" y="164" text-anchor="middle" font-size="12" fill="#DCEDE8">DOST Scholar</text><rect x="511" y="148" width="74" height="24" rx="12" fill="#BFE3E6" fill-opacity="0.12" stroke="#BFE3E6" stroke-opacity=".6"/><text x="548" y="164" text-anchor="middle" font-size="12" fill="#DCEDE8">CS @ VSU</text></svg>